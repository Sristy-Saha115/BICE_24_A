<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Webpage</title>
    <style>
        .container{
            display:flex;
            background-color: brown;
        }
        .container div{
            background-color: white;
            margin: 10px;
            padding:10px;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: medium;
        }
    .div1{
        height:100px;
        width:100px;
        border:10px solid black;
        background-color:pink;

        left: 100px;
        right: 100px;
        clear:left;
        float:left;
    }
    .contain{
        display:grid;
        grid-template-columns: auto auto auto;
        background-color: rgb(101, 226, 43);
        padding: 10px;
    }
    .contain div{
        background-color: pink;
        border: 1px solid black;
        padding: 10px;
        font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        font-size: medium;
        text-align: center;
    }
    .div2{
        width:100px;
        height:100px;
        border:10px solid blue;
        background-color:pink;
        
        left: 200px;
        right: 10px;
        clear:left;
        float:left;
    }
    .div3{
        width:100px;
        height:100px;
        border:10px solid green;
        background-color:pink;
        
        left: 200px;
        right: 10px;
        clear:left;
        float:left;
    }
    
    
    </style>
</head>
<body>

    <h1>This is a Main Heading</h1>
    
        <div class="div1">this is div1</div>
        <div class="div2">this is div2</div>
        <div class="div3">this is div3</div>

        <div class="container">
            <div>Item 1</div>
            <div>Item 2</div>
            <div>Item 3</div>
        </div>

        <div class="contain">
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>
            <div>6</div>
        </div>

</body>
</html>
