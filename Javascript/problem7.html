<!DOCTYPE html>
<html>
<head>
    <title>Problem 7</title>
</head>
<body>
    <h1>University Admission Eligibility Checker</h1>
    <input type="number" id="ssc" placeholder="Enter your SSC Grade">
    <br><br>
    <input type="number" id="hsc" placeholder="Enter your HSC Grade">
    <br><br>
    <input type="number" id="admark" placeholder="Enter your Adminission Mark">
    <br><br>
    <button onclick="check()">Submit</button>
    <p id = "result"></p>
    <script>
        function check(){
        let a = document.getElementById("ssc").value;
        let b = document.getElementById("hsc").value;
        let c = document.getElementById("admark").value;
        let message;

        if(a>=3.50 && b>=3.50 && c>=40){
         message ="Eligible";
        }else{
            message ="Not Eligible";
        }

        document.getElementById("result").innerHTML=message;
    }
    </script>

</body>
</html>
