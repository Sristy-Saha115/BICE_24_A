<!DOCTYPE html>
<html>
    <head>
        <title>Problem 10</title>
    </head>
    <body>
        <h1>Restaurant Menu Selection System</h1>
        <form>
            <label for="food">Enter menu choice (1-5)</label>
            <input type="number" id="food" placeholder="(1-5)">
            <button type="button" onclick="check()">Select Food</button>
        </form>
        <p id="result"></p>
        <script>
            function check(){
            let a = Number(document.getElementById("food").value);
            let food;
            let price;
            switch(a){
                case 1:
                    food="Burger";
                    price=200;
                    break;
                case 2:
                    food="Pizza";
                    price=300;
                    break;
                case 3:
                    food="Sandwich";
                    price=400;
                    break;
                case 4:
                    food="Pasta";
                    price=500;
                    break;
                case 5:
                    food="Coffee";
                    price=200;
                    break;
                default:
                    food="Please choose from 1 to 5";
                    price=null;

            }

            document.getElementById("result").innerHTML =
            "Selected Food is :" + food +"<br>"+
            "Price is :" +price;
            }
        </script>
    </body>
</html>
